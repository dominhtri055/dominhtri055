name: Build animated cat GIF

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_cat_gif.py'
      - '.github/workflows/build-cat-gif.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - run: python scripts/generate_cat_gif.py
      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cat-walk.gif
          git diff --cached --quiet && exit 0
          git commit -m "Generate animated cat GIF"
          git push
