<svg xmlns="http://www.w3.org/2000/svg" width="760" height="100" viewBox="0 0 760 100" role="img" aria-label="Animated cat walking, lying on Tri Do, then walking again">
  <rect width="760" height="100" fill="none"/>

  <text x="380" y="84" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#8b949e" letter-spacing="6">TRI DO</text>
  <line x1="30" y1="89" x2="730" y2="89" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <!-- Walking state -->
  <g id="walking-cat">
    <text x="0" y="55" font-size="38">🐈‍⬛</text>
    <animateTransform attributeName="transform" type="translate"
      values="20 0;320 0;320 0;680 0;680 0;320 0;320 0;20 0"
      keyTimes="0;0.20;0.42;0.58;0.64;0.80;0.94;1"
      dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values="1;1;0;0;1;1;0;1"
      keyTimes="0;0.20;0.22;0.40;0.42;0.80;0.82;1"
      dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Clearly lying-down state over TRI DO -->
  <g id="sleeping-cat" opacity="0" transform="translate(360 50) rotate(90)">
    <text x="0" y="0" font-size="42">🐈‍⬛</text>
    <animate attributeName="opacity"
      values="0;0;1;1;0;0;1;1;0"
      keyTimes="0;0.21;0.23;0.39;0.41;0.81;0.83;0.93;1"
      dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Sleeping indicator -->
  <g opacity="0">
    <text x="415" y="38" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#58a6ff">Z</text>
    <text x="432" y="28" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#58a6ff">z</text>
    <text x="445" y="20" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#58a6ff">z</text>
    <animate attributeName="opacity"
      values="0;0;1;0.35;1;0;0;1;0.35;0"
      keyTimes="0;0.23;0.26;0.30;0.36;0.41;0.83;0.86;0.91;1"
      dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- Small label makes the pause unmistakable -->
  <text x="380" y="18" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#8b949e" opacity="0">nap time 😴
    <animate attributeName="opacity" values="0;0;1;1;0;0;1;1;0" keyTimes="0;0.23;0.26;0.38;0.41;0.83;0.86;0.92;1" dur="14s" repeatCount="indefinite"/>
  </text>
</svg>
