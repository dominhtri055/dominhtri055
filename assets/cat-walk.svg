<svg xmlns="http://www.w3.org/2000/svg" width="760" height="72" viewBox="0 0 760 72" role="img" aria-label="Animated cat walking back and forth">
  <rect width="760" height="72" fill="none"/>
  <line x1="30" y1="56" x2="730" y2="56" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>
  <text x="380" y="53" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#8b949e" letter-spacing="5">TRI DO</text>
  <g>
    <text x="0" y="42" font-size="34">🐈‍⬛</text>
    <animateTransform attributeName="transform" type="translate" values="30 0;680 0;30 0" keyTimes="0;0.5;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.92;1;0.92;1" dur="1s" repeatCount="indefinite"/>
  </g>
</svg>
