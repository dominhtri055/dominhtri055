<svg xmlns="http://www.w3.org/2000/svg" width="760" height="130" viewBox="0 0 760 130" role="img" aria-label="Animated black cat walking to Tri Do, lying down, then walking away">
  <rect width="760" height="130" fill="none"/>

  <text x="380" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#8b949e" letter-spacing="7">TRI DO</text>
  <line x1="28" y1="118" x2="732" y2="118" stroke="#30363d" stroke-width="2" stroke-linecap="round"/>

  <!-- WALKING CAT -->
  <g id="walking" fill="#161b22" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="29" ry="16"/>

    <!-- Head + ears -->
    <circle cx="31" cy="-9" r="14"/>
    <path d="M20 -18 L23 -34 L31 -21 Z"/>
    <path d="M34 -22 L44 -34 L43 -16 Z"/>

    <!-- Face -->
    <circle cx="35" cy="-11" r="1.6" fill="#58a6ff" stroke="none"/>
    <path d="M44 -7 L50 -8 M44 -4 L51 -3" fill="none"/>

    <!-- Tail -->
    <path d="M-27 -5 C-48 -15 -51 -38 -35 -42 C-24 -45 -20 -34 -28 -29" fill="none" stroke="#8b949e" stroke-width="6"/>

    <!-- Front leg A -->
    <g transform="translate(18 12)">
      <path d="M0 0 L2 21" fill="none" stroke="#8b949e" stroke-width="5"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="18 0 0;-20 0 0;18 0 0" dur="0.7s" repeatCount="indefinite"/>
    </g>

    <!-- Front leg B -->
    <g transform="translate(7 12)">
      <path d="M0 0 L1 21" fill="none" stroke="#8b949e" stroke-width="5"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-20 0 0;18 0 0;-20 0 0" dur="0.7s" repeatCount="indefinite"/>
    </g>

    <!-- Back leg A -->
    <g transform="translate(-17 11)">
      <path d="M0 0 L-3 21" fill="none" stroke="#8b949e" stroke-width="5"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="-18 0 0;20 0 0;-18 0 0" dur="0.7s" repeatCount="indefinite"/>
    </g>

    <!-- Back leg B -->
    <g transform="translate(-6 12)">
      <path d="M0 0 L-1 21" fill="none" stroke="#8b949e" stroke-width="5"/>
      <animateTransform attributeName="transform" additive="sum" type="rotate" values="20 0 0;-18 0 0;20 0 0" dur="0.7s" repeatCount="indefinite"/>
    </g>

    <!-- little body bob while walking -->
    <animateTransform attributeName="transform" type="translate"
      values="55 68;55 65;170 68;285 65;345 68;345 68;345 68;345 68;455 65;575 68;690 65"
      keyTimes="0;0.04;0.12;0.20;0.27;0.31;0.55;0.59;0.72;0.86;1"
      dur="16s" repeatCount="indefinite"/>

    <!-- hide walking form during nap -->
    <animate attributeName="opacity"
      values="1;1;1;0;0;0;1;1"
      keyTimes="0;0.27;0.30;0.32;0.56;0.58;0.60;1"
      dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- LYING CAT -->
  <g id="lying" opacity="0" transform="translate(380 70)" fill="#161b22" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- stretched body -->
    <ellipse cx="0" cy="7" rx="43" ry="16"/>

    <!-- head resting on the right -->
    <circle cx="42" cy="5" r="15"/>
    <path d="M32 -5 L34 -19 L42 -8 Z"/>
    <path d="M44 -9 L54 -18 L53 -2 Z"/>
    <path d="M48 8 L54 8" fill="none"/>

    <!-- tucked paws -->
    <ellipse cx="21" cy="20" rx="11" ry="4"/>
    <ellipse cx="35" cy="20" rx="11" ry="4"/>

    <!-- curled tail -->
    <path d="M-38 7 C-65 3 -66 -26 -45 -27 C-28 -27 -26 -13 -37 -8" fill="none" stroke="#8b949e" stroke-width="6"/>

    <!-- breathing -->
    <animateTransform attributeName="transform" additive="sum" type="scale"
      values="1 1;1.025 1.04;1 1" dur="1.8s" repeatCount="indefinite"/>

    <animate attributeName="opacity"
      values="0;0;1;1;1;0;0"
      keyTimes="0;0.30;0.33;0.54;0.57;0.60;1"
      dur="16s" repeatCount="indefinite"/>
  </g>

  <!-- sleep bubbles -->
  <g fill="#58a6ff" font-family="Arial, Helvetica, sans-serif" font-weight="700" opacity="0">
    <text x="435" y="48" font-size="16">z</text>
    <text x="450" y="36" font-size="13">z</text>
    <text x="462" y="26" font-size="10">z</text>
    <animate attributeName="opacity" values="0;0;1;0.35;1;0;0" keyTimes="0;0.33;0.37;0.43;0.51;0.58;1" dur="16s" repeatCount="indefinite"/>
  </g>
</svg>